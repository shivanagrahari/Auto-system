<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="container">

    <!-- REGISTER PAGE -->
    <section id="registerPage" class="auth-card">
      <h1>Create Account</h1>
      <p>Register to get started</p>

      <form id="registerForm">
        <label for="registerEmail">Email</label>
        <input id="registerEmail" type="email" placeholder="Enter your email" required>

        <label for="registerPassword">Password</label>
        <input id="registerPassword" type="password" placeholder="Enter password" required minlength="6">

        <button type="submit">Register</button>
      </form>

      <p id="registerMessage" class="message"></p>
      <p>Already have an account?
        <a href="#" id="showLogin">Login</a>
      </p>
    </section>

    <!-- LOGIN PAGE -->
    <section id="loginPage" class="auth-card hidden">
      <h1>Welcome Back</h1>
      <p>Login to your account</p>

      <form id="loginForm">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" placeholder="Enter your email" required>

        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" placeholder="Enter password" required>

        <button type="submit">Login</button>
      </form>

      <p id="loginMessage" class="message"></p>
      <p>Don't have an account?
        <a href="#" id="showRegister">Register</a>
      </p>
    </section>

    <!-- PROFILE PAGE -->
    <section id="profilePage" class="hidden">
      <div id="profileResult"></div>
      <button id="logoutButton" type="button">Logout</button>
    </section>

  </main>

  <script src="/script.js"></script>
    
</body>
</html>
